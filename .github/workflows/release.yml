# Publishing to PyPI with Trusted Publishing - no token anywhere.
#
# HOW A RELEASE IS MADE (CONTRIBUTING.md, section 6):
#   1. The release's changes are on main and the "tests" run is green.
#   2. On GitHub: Releases -> Draft a new release -> a new tag named
#      v<version>, e.g. v1.65.0, exactly the version in pyproject.toml
#      -> Publish release.
#   3. This workflow builds and checks the package. The upload then
#      waits in the "pypi" environment until a maintainer approves it
#      (repository Settings -> Environments -> pypi).
#   4. Meanwhile it attaches to the release the files people install:
#      the QGIS, Pro and Stata zips, the SSC archive, the wheel and
#      source archive PyPI gets, the Gridby GeoPackage and their
#      checksums (tools/release_assets.sh, BACKLOG 506). Nothing is
#      attached by hand any more. Since 1.68.0 a ninth file: the MCP
#      Bundle, equipop-<v>.mcpb (BACKLOG 522).
#   5. Then, only once PyPI has the package and the release page the
#      bundle, the "registry" job writes server.json and lists the
#      server in the MCP Registry as io.github.geocalista/equipop. It
#      waits in the "mcp-registry" environment for a maintainer's
#      approval, exactly as the PyPI upload does; the registry grants
#      the organisation's namespace to this workflow by OIDC, no token.
#
# ONE BUILD (BACKLOG 513, the external review of 23 November). Until
# 1.66.0 the wheel and source archive were built twice: once here for
# PyPI, without the Pro help files, and again inside make_bundle.sh for
# the release page. Measured on 1.65.0: the same code, but different
# bytes, so SHA256SUMS.txt did not describe what PyPI serves, and
# PyPI's source archive carried none of the ten Pro help files. Now
# the build job makes every file once, PyPI gets the wheel and source
# archive from that one set, and a step checks them against the
# checksums the release page carries.
#
# PyPI trusts this file by name: the trusted publisher on PyPI is
# owner GeoCalista, repository EquiPop, workflow release.yml,
# environment pypi. Renaming this file, the repository or the
# environment breaks the trust until PyPI is told. BACKLOG 500.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build every file once
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag must be the version in the code
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject.toml says $V, the release tag is $GITHUB_REF_NAME"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$V. Delete the release and its tag, and make it again as v$V."
            exit 1
          fi
      - name: Install the build tools
        # pytest: the Pro help generator loads the toolbox with the arcpy
        # stand-in in tests/ (BACKLOG 497); geopandas: the Gridby file
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest geopandas pyogrio
          # uv and mcp: the MCP Bundle's lock file and tool list (BACKLOG 522)
          python -m pip install uv "mcp>=2"
          python -m pip install -e .
      - name: Build every file of the release, once
        # make_bundle.sh writes the Pro help first, then builds the wheel
        # and the source archive exactly once (and checks the source
        # archive carries every help file); release_assets.sh gathers
        # what the release page carries and their SHA-256.
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! bash tools/make_bundle.sh "$V" "$RUNNER_TEMP/bundle" > "$RUNNER_TEMP/bundle.log" 2>&1; then
            cat "$RUNNER_TEMP/bundle.log"; exit 1
          fi
          bash tools/release_assets.sh "$V" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/assets"
          mkdir -p dist
          cp "$RUNNER_TEMP/assets/equipop-$V-py3-none-any.whl" "$RUNNER_TEMP/assets/equipop-$V.tar.gz" dist/
          python -m twine check --strict dist/*
      - name: PyPI gets exactly the files the release page lists
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v w="equipop-$V-py3-none-any.whl" -v t="equipop-$V.tar.gz" '$2 == w || $2 == t' "$RUNNER_TEMP/assets/SHA256SUMS.txt" > "$RUNNER_TEMP/pypi.sha256"
          test "$(wc -l < "$RUNNER_TEMP/pypi.sha256")" -eq 2
          ( cd dist && sha256sum -c "$RUNNER_TEMP/pypi.sha256" )
          test "$(ls dist | wc -l)" -eq 2
      - name: Install the wheel into a clean Python and run it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I -c "import equipop, numpy as np; from equipop import stata_bridge as sb; r = sb.dispatch('counts', np.arange(5.0) * 100, np.zeros(5), k_values=[2]); assert list(r['N_2']) == [2.0] * 5, r; print('equipop', equipop.__version__, 'runs')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: ${{ runner.temp }}/assets/
          retention-days: 30

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/equipop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    name: attach the files people install
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # to add files to this release, nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets/
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" assets/* --clobber --repo "$GITHUB_REPOSITORY"

  registry:
    name: list in the MCP Registry
    # BACKLOG 522. After BOTH: the registry checks that PyPI serves
    # this version with the mcp-name line in its README, and that the
    # bundle's URL on the release page answers.
    needs: [build, publish, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.geocalista/equipop
    permissions:
      id-token: write          # OIDC: the organisation's namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets/
      - name: Write server.json for this release
        run: |
          V="${GITHUB_REF_NAME#v}"
          python tools/make_server_json.py "$V" assets > server.json
          cat server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        # the registry's own recipe: a pinned release, its Sigstore
        # bundle checked before the binary is run
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish the entry
        run: ./mcp-publisher publish
